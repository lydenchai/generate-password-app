<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Generator</title>
    <meta
      name="description"
      content="A simple, fast, and secure password generator with customizable options."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="app-wrapper">
      <div class="card">
        <!-- Header -->
        <header class="card-header">
          <div>
            <h1>Password Generator</h1>
            <p class="subtitle">Generate clean, random, and secure passwords</p>
          </div>
          <button
            type="button"
            id="theme-toggle"
            class="icon-btn theme-btn"
            title="Toggle color theme"
            aria-label="Toggle theme"
          >
            <!-- Sun icon (for dark mode) -->
            <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="5" />
              <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
            </svg>
            <!-- Moon icon (for light mode) -->
            <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
            </svg>
          </button>
        </header>

        <!-- Password Display -->
        <div class="password-field">
          <input
            type="text"
            id="password"
            readonly
            placeholder="Your password will appear here"
            aria-label="Generated password"
            spellcheck="false"
          />
          <div class="field-actions">
            <button
              type="button"
              id="refresh-btn"
              class="icon-btn"
              onclick="generatePassword()"
              title="Generate new password"
              aria-label="Generate new password"
            >
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2" />
              </svg>
            </button>
            <button
              type="button"
              id="copy-icon-btn"
              class="icon-btn"
              onclick="copyToClipboard()"
              title="Copy to clipboard"
              aria-label="Copy to clipboard"
            >
              <svg class="copy-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2" />
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
              </svg>
              <svg class="check-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <polyline points="20 6 9 17 4 12" />
              </svg>
            </button>
          </div>
        </div>

        <!-- Strength Indicator -->
        <div class="strength-row">
          <div class="strength-bars">
            <span class="bar" id="bar-1"></span>
            <span class="bar" id="bar-2"></span>
            <span class="bar" id="bar-3"></span>
            <span class="bar" id="bar-4"></span>
          </div>
          <span class="strength-label" id="strength-label">Strength: Strong</span>
        </div>

        <!-- Length Setting -->
        <div class="setting-group">
          <div class="setting-header">
            <label for="password-length" class="setting-label">Length</label>
            <div class="length-display">
              <input type="number" id="password-length" min="4" max="64" value="16" />
            </div>
          </div>
          <input type="range" id="length-slider" min="4" max="64" value="16" />
          <div class="preset-row">
            <button type="button" class="preset-btn" data-len="8">8</button>
            <button type="button" class="preset-btn" data-len="12">12</button>
            <button type="button" class="preset-btn active" data-len="16">16</button>
            <button type="button" class="preset-btn" data-len="20">20</button>
            <button type="button" class="preset-btn" data-len="24">24</button>
            <button type="button" class="preset-btn" data-len="32">32</button>
          </div>
        </div>

        <!-- Character Set Options -->
        <div class="setting-group">
          <span class="setting-label">Character Types</span>
          <div class="options-list">
            <label class="option-item" for="uppercase">
              <span class="option-title">Uppercase (A-Z)</span>
              <input type="checkbox" id="uppercase" checked />
            </label>

            <label class="option-item" for="lowercase">
              <span class="option-title">Lowercase (a-z)</span>
              <input type="checkbox" id="lowercase" checked />
            </label>

            <label class="option-item" for="numbers">
              <span class="option-title">Numbers (0-9)</span>
              <input type="checkbox" id="numbers" checked />
            </label>

            <label class="option-item" for="symbols">
              <span class="option-title">Symbols (!@#$%^&*)</span>
              <input type="checkbox" id="symbols" checked />
            </label>

            <label class="option-item" for="exclude-similar">
              <span class="option-title">Exclude similar characters (i, l, 1, L, o, 0, O)</span>
              <input type="checkbox" id="exclude-similar" />
            </label>
          </div>
        </div>

        <!-- Main Buttons -->
        <div class="actions-row">
          <button type="button" class="btn btn-primary" onclick="generatePassword()">
            Generate Password
          </button>
          <button type="button" class="btn btn-secondary" id="copy-btn" onclick="copyToClipboard()">
            Copy
          </button>
        </div>

        <!-- Utility Footer -->
        <div class="card-footer">
          <button type="button" class="link-btn" onclick="resetDefaults()">Reset</button>
          <button type="button" class="link-btn" onclick="toggleHistory()">
            History (<span id="history-count">0</span>)
          </button>
        </div>

        <!-- History Panel -->
        <div class="history-panel hidden" id="history-panel">
          <div class="history-header">
            <span>Recent Passwords</span>
            <button type="button" class="link-btn danger" onclick="clearHistory()">Clear</button>
          </div>
          <ul class="history-list" id="history-list">
            <li class="history-empty">No passwords saved yet</li>
          </ul>
        </div>
      </div>
    </main>

    <!-- Toast Notification -->
    <div id="toast" class="toast" role="status" aria-live="polite">
      <span id="toast-text">Password copied</span>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
